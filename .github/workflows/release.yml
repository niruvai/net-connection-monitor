name: Release

# Builds the macOS and Windows apps and publishes them as a GitHub Release named
# v<version>, where <version> comes from core/version.py. Runs when that version
# changes on main, when a v* tag is pushed, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["core/version.py", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('core/version.py').read()).group(1))")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$version"

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    needs: meta
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and DMG (ad-hoc signed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv .venv
          ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build exe and installer
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\packaging\build_windows.ps1
      - name: Zip portable build
        shell: pwsh
        run: |
          $v = (python -c "from core.version import __version__; print(__version__)").Trim()
          Compress-Archive -Path dist\NetWatcher\* -DestinationPath "dist\installer\NetWatcher-$v-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/installer/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, macos, windows]
    if: ${{ !cancelled() && (needs.macos.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Net Watcher ${{ needs.meta.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          files: artifacts/*
