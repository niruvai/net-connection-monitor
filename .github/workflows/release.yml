name: Release

# Push a tag like v1.0.0 (or run manually) to build the macOS and Windows apps
# and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and DMG (ad-hoc signed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv .venv
          ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build exe and installer
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\packaging\build_windows.ps1
      - name: Zip portable build
        shell: pwsh
        run: |
          $v = (python -c "from core.version import __version__; print(__version__)").Trim()
          Compress-Archive -Path dist\NetWatcher\* -DestinationPath "dist\installer\NetWatcher-$v-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/installer/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: ${{ !cancelled() && (needs.macos.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Net Watcher ${{ env.RELEASE_TAG }}
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          files: artifacts/*
